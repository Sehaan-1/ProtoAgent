[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "ag2"
dynamic = ["version"]
description = "Clean, async-first, protocol-driven multi-agent framework (AG2 v1.x architecture)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "ProtoAgent Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.6.0",
    "httpx>=0.27.2",
    "opentelemetry-api>=1.28.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.55.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
gemini = [
    "google-genai>=1.0.0",
]
mcp = [
    "mcp>=2.0.0",
]
storage = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
]
telemetry = [
    "opentelemetry-sdk>=1.28.0",
]
all = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "mcp>=2.0.0",
    "openai>=1.55.0",
    "opentelemetry-sdk>=1.28.0",
]

[dependency-groups]
dev = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "mcp>=2.0.0",
    "mypy>=1.13.0",
    "openai>=1.55.0",
    "opentelemetry-sdk>=1.28.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "types-aiofiles>=24.1.0",
]

[tool.hatch.version]
path = "ag2/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ag2"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ag2", "test"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ag2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
mypy_path = ["."]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end integration tests",
]

[tool.coverage.run]
source = ["ag2"]
branch = true
